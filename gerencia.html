<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe Diario - Gerencia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <!-- Supabase y Chart.js desde CDN (no pasan por el SW) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <style>
        :root {
            --primary-color: #00224D;
            --primary-light: #003B91;
            --accent-color: #00AEEF;
            --secondary-accent: #F7941D;
            --success-color: #39B54A;
            --bg-color: #f0f4f8;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-light: #94a3b8;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',system-ui,sans-serif; background:var(--bg-color); color:var(--text-primary); min-height:100vh; }

        .gerencia-header {
            background:linear-gradient(135deg,#00224D 0%,#003B91 60%,#00AEEF 100%);
            color:white; padding:20px 28px; display:flex; align-items:center;
            justify-content:space-between; flex-wrap:wrap; gap:16px;
            box-shadow:0 4px 20px rgba(0,34,77,.25); position:relative; overflow:hidden;
        }
        .gerencia-header h1 { font-size:22px; font-weight:900; display:flex; align-items:center; gap:10px; }
        .gerencia-header .subtitle { font-size:12px; opacity:.85; margin-top:2px; }
        .header-controls { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .date-wrap { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.15); border-radius:12px; padding:8px 14px; border:1px solid rgba(255,255,255,.2); }
        .date-wrap label { font-size:12px; font-weight:700; text-transform:uppercase; }
        .date-wrap input[type=date] { background:rgba(255,255,255,.95); border:none; border-radius:8px; padding:8px 12px; font-family:'Inter',sans-serif; font-weight:700; font-size:14px; color:#00224D; cursor:pointer; }
        .hbtn { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.25); color:white; padding:10px 16px; border-radius:10px; cursor:pointer; font-weight:700; font-size:13px; display:flex; align-items:center; gap:6px; font-family:'Inter',sans-serif; }
        .hbtn:hover { background:rgba(255,255,255,.28); }
        .rind { font-size:11px; font-weight:600; opacity:.8; display:flex; align-items:center; gap:6px; }
        .rind .dot { width:8px; height:8px; border-radius:50%; background:#39B54A; animation:pulse 2s infinite; }
        .rind.loading .dot { background:#FFC20E; }
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

        .content { max-width:1500px; margin:0 auto; padding:24px; }

        .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px; margin-bottom:28px; }
        .kpi-card { background:white; border-radius:16px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,.06); position:relative; overflow:hidden; border:1px solid rgba(0,0,0,.04); }
        .kpi-card .ico { position:absolute; right:-8px; bottom:-8px; opacity:.07; font-size:80px; }
        .kpi-label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:#94a3b8; margin-bottom:10px; }
        .kpi-value { font-size:36px; font-weight:900; letter-spacing:-1px; line-height:1; }
        .kpi-sub { font-size:12px; color:#475569; margin-top:8px; font-weight:600; }
        .c-primary { color:#00224D; } .c-accent { color:#00AEEF; } .c-orange { color:#F7941D; } .c-green { color:#39B54A; }

        .card { background:white; border-radius:16px; box-shadow:0 2px 12px rgba(0,0,0,.06); margin-bottom:24px; border:1px solid rgba(0,0,0,.04); overflow:hidden; }
        .card-header { padding:18px 24px; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; justify-content:space-between; }
        .card-header h2 { font-size:16px; font-weight:800; color:#00224D; display:flex; align-items:center; gap:8px; }
        .card-header h2 .material-icons-round { font-size:22px; color:#00AEEF; }
        .card-body { padding:20px 24px; }

        .charts-row { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-bottom:24px; }
        @media(max-width:900px){ .charts-row{grid-template-columns:1fr} }

        .pivot-scroll { overflow-x:auto; }
        table.ptable { width:100%; border-collapse:collapse; font-size:13px; }
        table.ptable th,table.ptable td { padding:10px 12px; text-align:center; border:1px solid #e2e8f0; }
        table.ptable thead th { background:#00224D; color:white; font-weight:700; font-size:11px; text-transform:uppercase; position:sticky; top:0; z-index:1; }
        table.ptable thead th.acol { text-align:left; min-width:180px; }
        table.ptable thead th.zcol { min-width:90px; }
        table.ptable tbody td.acol { text-align:left; font-weight:700; color:#00224D; }
        table.ptable tbody td.zcol { color:#94a3b8; font-style:italic; }
        table.ptable tbody td.num { font-weight:600; }
        table.ptable tbody td.zero { color:#cbd5e1; }
        table.ptable tbody td.tcol { font-weight:800; background:#f0f4f8; color:#00224D; }
        table.ptable tbody tr:nth-child(even){ background:#f8fafc; }
        table.ptable tbody tr:hover { background:#e8f4ff; }
        table.ptable tfoot td { background:#00224D; color:white; font-weight:800; }
        table.ptable tfoot td.acol { text-align:left; }
        .h1{background:rgba(0,174,239,.10)!important} .h2{background:rgba(0,174,239,.20)!important}
        .h3{background:rgba(0,174,239,.32)!important} .h4{background:rgba(247,148,29,.22)!important}
        .h5{background:rgba(238,28,37,.18)!important}

        .dtable-wrap { max-height:480px; overflow:auto; }
        table.dtable { width:100%; border-collapse:collapse; font-size:12px; }
        table.dtable th { background:#f8fafc; color:#475569; font-size:10px; text-transform:uppercase; padding:10px 12px; text-align:left; position:sticky; top:0; border-bottom:2px solid #e2e8f0; }
        table.dtable td { padding:9px 12px; border-bottom:1px solid #f1f5f9; }
        table.dtable tbody tr:hover { background:#f8fafc; }
        .br { background:rgba(0,34,77,.06); color:#475569; padding:3px 8px; border-radius:4px; font-size:10px; font-weight:700; white-space:nowrap; }
        .brev { background:#39B54A; color:white; padding:2px 6px; border-radius:4px; font-size:9px; font-weight:800; text-transform:uppercase; }
        .vchk { color:#39B54A; font-weight:900; }
        .tcel { font-weight:700; color:#00224D; text-align:right; }

        .loading-box { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; color:#94a3b8; }
        .spinner { width:40px; height:40px; border:4px solid #e2e8f0; border-top:4px solid #00AEEF; border-radius:50%; animation:spin 1s linear infinite; margin-bottom:16px; }
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .empty { text-align:center; padding:60px 20px; color:#94a3b8; }
        .empty .material-icons-round { font-size:64px; opacity:.3; margin-bottom:16px; display:block; }
        .empty h3 { font-size:18px; font-weight:700; color:#475569; margin-bottom:8px; }

        .ctoggle { cursor:pointer; background:none; border:none; font-size:12px; font-weight:700; color:#00AEEF; display:flex; align-items:center; gap:4px; }
        .hidden { display:none; }

        @media print {
            body{background:white}
            .gerencia-header{box-shadow:none; padding:12px 20px}
            .hbtn,.rind,.ctoggle{display:none!important}
            .date-wrap{background:none;border:none;padding:0}
            .content{padding:12px;max-width:none}
            .card{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}
            .dtable-wrap{max-height:none;overflow:visible}
        }
    </style>
</head>
<body>

<div id="app">
    <div class="loading-box"><div class="spinner"></div><p style="font-weight:600">Cargando informe...</p></div>
</div>

<script>
// ─── Desregistrar SW inmediatamente ──────────────────────────────────────────
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
}

// ─── Configuración Supabase ───────────────────────────────────────────────────
const SUPABASE_URL = 'https://olrfvydwyndqquxmtuho.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9scmZ2eWR3eW5kcXF1eG10dWhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5MDE3NDUsImV4cCI6MjA4MzQ3Nzc0NX0.ui2jMr8-rG-bsFgeSea6ZpYks6utVClVGcQLq9Ptxn8';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ─── Estado ───────────────────────────────────────────────────────────────────
const today = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
let selectedDate = today();
let allReturns = [];
let charts = {};
let refreshTimer = null;
let lastUpdate = null;
let isLoading = false;

const COLORS = ['#00224D','#00AEEF','#F7941D','#39B54A','#EE1C25','#FFC20E','#8b5cf6','#ec4899','#14b8a6','#64748b','#f97316','#3b82f6','#a855f7','#10b981','#ef4444'];
const fmt = n => new Intl.NumberFormat('es-CO').format(n||0);
const fmtPrice = n => '$ ' + new Intl.NumberFormat('es-CO').format(n||0);
const fmtTime = ts => ts ? new Date(ts).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',hour12:true}) : '—';
const localDate = ts => { if(!ts) return selectedDate; const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

// ─── Fetch data ───────────────────────────────────────────────────────────────
async function fetchReturns(date) {
    const d0 = new Date(date + 'T00:00:00');
    const d1 = new Date(d0); d1.setDate(d1.getDate()-1);
    const d2 = new Date(d0); d2.setDate(d2.getDate()+1);
    const from = `${d1.getFullYear()}-${String(d1.getMonth()+1).padStart(2,'0')}-${String(d1.getDate()).padStart(2,'0')}T00:00:00`;
    const to   = `${d2.getFullYear()}-${String(d2.getMonth()+1).padStart(2,'0')}-${String(d2.getDate()).padStart(2,'0')}T23:59:59`;

    let all = [], page = 0, more = true;
    while (more) {
        const { data, error } = await sb.from('return_items')
            .select('*, routes(username, user_name)')
            .gte('created_at', from).lte('created_at', to)
            .order('created_at', { ascending: false })
            .range(page*1000, page*1000+999);
        if (error) throw error;
        all = all.concat(data || []);
        more = data && data.length === 1000;
        page++;
    }

    const mapped = all.map(r => ({
        id: r.id, invoice: r.invoice, sheet: r.sheet, code: r.product_code,
        productName: r.product_name, quantity: r.quantity, total: r.total,
        reason: r.reason || 'Sin motivo', timestamp: r.created_at,
        isResale: !!r.is_resale, verified: !!r.verified,
        auxiliarName: Array.isArray(r.routes) ? r.routes[0]?.user_name : r.routes?.user_name,
    }));

    // Deduplicar
    const seen = new Set();
    const deduped = mapped.filter(r => {
        const k = `${r.invoice}-${r.sheet}-${r.code||r.productName}-${r.quantity}-${r.total}-${r.isResale}-${(r.timestamp||'').substring(0,16)}`;
        if (seen.has(k)) return false; seen.add(k); return true;
    });

    return deduped.filter(r => localDate(r.timestamp) === date);
}

// ─── Pivot ────────────────────────────────────────────────────────────────────
function buildPivot(returns) {
    const auxSet = [...new Set(returns.map(r => r.auxiliarName||'Desconocido'))].sort((a,b)=>a.localeCompare(b,'es'));
    const causalCount = {};
    returns.forEach(r => { causalCount[r.reason] = (causalCount[r.reason]||0)+1; });
    const causals = Object.entries(causalCount).sort((a,b)=>b[1]-a[1]).map(([c])=>c);
    const matrix = {}, rowTotals = {}, rowValues = {}, colTotals = {};
    auxSet.forEach(a => { matrix[a]={}; rowTotals[a]=0; rowValues[a]=0; });
    causals.forEach(c => { colTotals[c]=0; });
    returns.forEach(r => {
        const a = r.auxiliarName||'Desconocido';
        matrix[a][r.reason] = (matrix[a][r.reason]||0)+1;
        rowTotals[a]++; rowValues[a]+=(r.total||0); colTotals[r.reason]++;
    });
    const grandValue = returns.reduce((s,r)=>s+(r.total||0),0);
    return { auxSet, causals, matrix, rowTotals, rowValues, colTotals, grandTotal: returns.length, grandValue };
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderShell() {
    document.getElementById('app').innerHTML = `
    <header class="gerencia-header">
        <div>
            <h1><span class="material-icons-round">insights</span> Informe Diario de Gerencia</h1>
            <p class="subtitle">Causales de devolución por auxiliar</p>
        </div>
        <div class="header-controls">
            <div class="date-wrap">
                <label>Fecha</label>
                <input type="date" id="dp" value="${selectedDate}">
            </div>
            <button class="hbtn" id="refreshBtn"><span class="material-icons-round" style="font-size:18px">refresh</span> Actualizar</button>
            <button class="hbtn" id="csvBtn"><span class="material-icons-round" style="font-size:18px">download</span> CSV</button>
            <button class="hbtn" onclick="window.print()"><span class="material-icons-round" style="font-size:18px">print</span> Imprimir</button>
            <div class="rind" id="rind"><span class="dot"></span><span id="rlabel">Actualizando...</span></div>
        </div>
    </header>
    <div class="content" id="content">
        <div class="loading-box"><div class="spinner"></div><p style="font-weight:600">Cargando datos...</p></div>
    </div>`;
    document.getElementById('dp').onchange = e => { selectedDate = e.target.value; loadAndRender(); };
    document.getElementById('refreshBtn').onclick = () => loadAndRender();
    document.getElementById('csvBtn').onclick = () => exportCSV();
}

function renderKPIs(returns) {
    const total = returns.length;
    const value = returns.reduce((s,r)=>s+(r.total||0),0);
    const auxs  = new Set(returns.map(r=>r.auxiliarName||'?')).size;
    const cc = {}; returns.forEach(r=>{ cc[r.reason]=(cc[r.reason]||0)+1; });
    const top = Object.entries(cc).sort((a,b)=>b[1]-a[1])[0];
    return `<div class="kpi-grid">
        <div class="kpi-card"><span class="material-icons-round ico">inventory_2</span>
            <div class="kpi-label">Devoluciones del día</div>
            <div class="kpi-value c-primary">${fmt(total)}</div>
            <div class="kpi-sub">items registrados</div></div>
        <div class="kpi-card"><span class="material-icons-round ico">payments</span>
            <div class="kpi-label">Valor total</div>
            <div class="kpi-value c-accent">${fmtPrice(value)}</div>
            <div class="kpi-sub">en devoluciones</div></div>
        <div class="kpi-card"><span class="material-icons-round ico">group</span>
            <div class="kpi-label">Auxiliares activos</div>
            <div class="kpi-value c-green">${auxs}</div>
            <div class="kpi-sub">con devoluciones hoy</div></div>
        <div class="kpi-card"><span class="material-icons-round ico">warning</span>
            <div class="kpi-label">Causal principal</div>
            <div class="kpi-value c-orange" style="font-size:18px;line-height:1.3">${top?top[0]:'—'}</div>
            <div class="kpi-sub">${top?top[1]:0} devoluciones</div></div>
    </div>`;
}

function renderPivot(p) {
    const { auxSet, causals, matrix, rowTotals, rowValues, colTotals, grandTotal, grandValue } = p;
    if (!auxSet.length) return `<div class="empty"><span class="material-icons-round">event_busy</span><h3>Sin devoluciones</h3><p>No hay registros para ${selectedDate}</p></div>`;
    const maxC = Math.max(...causals.map(c=>colTotals[c]),1);
    const hc = n => { if(!n) return 'zero'; const r=n/maxC; return r>.75?'h5':r>.5?'h4':r>.35?'h3':r>.15?'h2':'h1'; };
    let h = `<div class="pivot-scroll"><table class="ptable"><thead><tr>
        <th class="acol">Auxiliar</th><th class="zcol">Zona</th>
        ${causals.map(c=>`<th>${c}</th>`).join('')}
        <th style="background:#003B91">Total</th><th style="background:#003B91">Valor</th>
    </tr></thead><tbody>`;
    auxSet.forEach(a => {
        h += `<tr><td class="acol">${a}</td><td class="zcol">—</td>
        ${causals.map(c=>{ const n=matrix[a][c]||0; return `<td class="num ${hc(n)}">${n||'—'}</td>`; }).join('')}
        <td class="tcol">${rowTotals[a]}</td>
        <td class="tcol" style="text-align:right;font-size:12px">${fmtPrice(rowValues[a])}</td></tr>`;
    });
    h += `</tbody><tfoot><tr><td class="acol">TOTAL</td><td></td>
        ${causals.map(c=>`<td>${colTotals[c]}</td>`).join('')}
        <td>${grandTotal}</td><td style="text-align:right">${fmtPrice(grandValue)}</td>
    </tr></tfoot></table></div>`;
    return h;
}

function renderContent() {
    const el = document.getElementById('content');
    if (!el) return;
    if (!allReturns.length) {
        el.innerHTML = renderKPIs(allReturns) + `<div class="card"><div class="card-body"><div class="empty">
            <span class="material-icons-round">event_busy</span><h3>Sin devoluciones</h3>
            <p>No se registraron devoluciones para el ${selectedDate}</p></div></div></div>`;
        return;
    }
    const p = buildPivot(allReturns);
    const sorted = [...allReturns].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));

    el.innerHTML = `
    ${renderKPIs(allReturns)}
    <div class="card">
        <div class="card-header"><h2><span class="material-icons-round">grid_on</span> Causales por Auxiliar</h2></div>
        <div class="card-body">${renderPivot(p)}</div>
    </div>
    <div class="charts-row">
        <div class="card">
            <div class="card-header"><h2><span class="material-icons-round">donut_large</span> Distribución por Causal</h2></div>
            <div class="card-body" style="height:320px"><canvas id="cc"></canvas></div>
        </div>
        <div class="card">
            <div class="card-header"><h2><span class="material-icons-round">format_list_numbered</span> Devoluciones por Auxiliar</h2></div>
            <div class="card-body" style="height:320px"><canvas id="ac"></canvas></div>
        </div>
    </div>
    <div class="card">
        <div class="card-header">
            <h2><span class="material-icons-round">list_alt</span> Detalle (${sorted.length} registros)</h2>
            <button class="ctoggle" id="dtoggle"><span class="material-icons-round" style="font-size:16px">expand_less</span> Contraer</button>
        </div>
        <div id="dtbody">
        <div class="dtable-wrap"><table class="dtable">
            <thead><tr>
                <th>Hora</th><th>Auxiliar</th><th>Zona</th><th>Factura</th><th>Planilla</th>
                <th>Producto</th><th>Causal</th><th style="text-align:center">Cant</th>
                <th style="text-align:right">Total</th><th style="text-align:center">OK</th>
            </tr></thead>
            <tbody>${sorted.map(r=>`
                <tr>
                    <td style="white-space:nowrap;color:#94a3b8">${fmtTime(r.timestamp)}</td>
                    <td style="font-weight:600">${r.auxiliarName||'Desconocido'}</td>
                    <td style="color:#94a3b8;font-style:italic">—</td>
                    <td>${r.invoice}</td>
                    <td>${r.sheet||'—'}</td>
                    <td>${r.isResale?'<span class="brev">Reventa</span> ':''}${r.code?r.code+' - ':''}${(r.productName||'N/A').substring(0,38)}</td>
                    <td><span class="br">${r.reason}</span></td>
                    <td style="text-align:center;font-weight:600">${r.quantity}</td>
                    <td class="tcel">${fmtPrice(r.total)}</td>
                    <td style="text-align:center">${r.verified?'<span class="vchk">✓</span>':''}</td>
                </tr>`).join('')}
            </tbody>
        </table></div>
        </div>
    </div>`;

    requestAnimationFrame(() => {
        buildCharts(allReturns);
        document.getElementById('dtoggle').onclick = () => {
            const b = document.getElementById('dtbody');
            const tog = document.getElementById('dtoggle');
            b.classList.toggle('hidden');
            tog.innerHTML = b.classList.contains('hidden')
                ? '<span class="material-icons-round" style="font-size:16px">expand_more</span> Expandir'
                : '<span class="material-icons-round" style="font-size:16px">expand_less</span> Contraer';
        };
    });
}

function buildCharts(returns) {
    Object.values(charts).forEach(c=>{ try{c.destroy()}catch(e){} }); charts={};
    if (typeof Chart==='undefined' || !returns.length) return;

    const cc={}; returns.forEach(r=>{ cc[r.reason]=(cc[r.reason]||0)+1; });
    const sc = Object.entries(cc).sort((a,b)=>b[1]-a[1]);
    const ccEl = document.getElementById('cc');
    if (ccEl) charts.c = new Chart(ccEl,{ type:'doughnut', data:{ labels:sc.map(c=>c[0]),
        datasets:[{data:sc.map(c=>c[1]), backgroundColor:sc.map((_,i)=>COLORS[i%COLORS.length]), borderWidth:2, borderColor:'#fff', spacing:3}]},
        options:{ responsive:true, maintainAspectRatio:false, cutout:'55%',
            plugins:{ legend:{ position:'right', labels:{font:{size:11,weight:'600'},color:'#475569',padding:10,boxWidth:12}},
            tooltip:{ callbacks:{ label:ctx=>`${ctx.label}: ${ctx.raw} (${Math.round(ctx.raw/returns.length*100)}%)`}}}}});

    const ac={}; returns.forEach(r=>{ const n=r.auxiliarName||'?'; ac[n]=(ac[n]||0)+1; });
    const sa = Object.entries(ac).sort((a,b)=>b[1]-a[1]).slice(0,15);
    const acEl = document.getElementById('ac');
    if (acEl) charts.a = new Chart(acEl,{ type:'bar',
        data:{ labels:sa.map(a=>a[0].length>22?a[0].substring(0,20)+'…':a[0]),
            datasets:[{data:sa.map(a=>a[1]), backgroundColor:'rgba(0,174,239,.7)', hoverBackgroundColor:'#00AEEF', borderRadius:6, barThickness:'flex'}]},
        options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
            plugins:{legend:{display:false}},
            scales:{ x:{grid:{color:'#f1f5f9'},ticks:{color:'#94a3b8',font:{weight:'600'}}},
                     y:{grid:{display:false},ticks:{color:'#0f172a',font:{size:11,weight:'600'}}}}}});
}

function exportCSV() {
    if (!allReturns.length) return;
    const rows = [['Fecha','Hora','Auxiliar','Zona','Factura','Planilla','Codigo','Producto','Causal','Cantidad','Total','Reventa','Verificado'],
        ...allReturns.map(r=>[localDate(r.timestamp),fmtTime(r.timestamp),r.auxiliarName||'',
            '',r.invoice,r.sheet||'',r.code||'',(r.productName||'').replace(/,/g,';'),
            r.reason||'',r.quantity,r.total,r.isResale?'S':'N',r.verified?'S':'N'])];
    const csv = rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}));
    a.download = `Gerencia_${selectedDate}.csv`; document.body.appendChild(a); a.click(); a.remove();
}

function setLoading(v) {
    isLoading = v;
    const rind = document.getElementById('rind');
    const rl   = document.getElementById('rlabel');
    if (!rind || !rl) return;
    rind.classList.toggle('loading', v);
    rl.textContent = v ? 'Actualizando...' : `Actualizado ${lastUpdate ? lastUpdate.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}) : ''}`;
}

async function loadAndRender() {
    if (isLoading) return;
    setLoading(true);
    try {
        allReturns = await fetchReturns(selectedDate);
        lastUpdate = new Date();
        renderContent();
    } catch(e) {
        console.error(e);
        const el = document.getElementById('content');
        if (el) el.innerHTML = `<div class="card"><div class="card-body"><div class="empty">
            <span class="material-icons-round" style="color:#EE1C25">error_outline</span>
            <h3>Error al cargar</h3><p>${e.message}</p></div></div></div>`;
    } finally { setLoading(false); }
}

// ─── Init ─────────────────────────────────────────────────────────────────────
renderShell();
loadAndRender();
refreshTimer = setInterval(loadAndRender, 60000);
</script>
</body>
</html>
